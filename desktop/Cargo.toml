[package]
name = "ferry"
version = "0.1.0"
edition = "2021"
description = "Ferry: share files and clipboard between Linux desktop and Android"
license = "MIT"

# No external dependencies: builds offline with just `cargo build --release`.
[dependencies]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
